name: Build SpendeX APK

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/debug/SpendeX.apk
          ls -lh app/build/outputs/apk/debug/SpendeX.apk

      - name: Upload SpendeX APK
        uses: actions/upload-artifact@v4
        with:
          name: SpendeX-v1.0.1
          path: app/build/outputs/apk/debug/SpendeX.apk
          if-no-files-found: error
          retention-days: 30
